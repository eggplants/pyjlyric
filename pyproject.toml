[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "pyjlyric"
description = "Japanese Lyric Aggregator"
readme = "README.md"
keywords = [
  "cli",
  "download-lyrics",
  "japanese",
  "japanese-songs",
  "lyrics",
  "lyrics-scraping",
  "scraping",
]
license = "MIT"
authors = [ { name = "eggplants", email = "w10776e8w@yahoo.co.jp" } ]
requires-python = ">=3.10,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Japanese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "chardet>=5.2,<8",
  "eval-type-backport>=0.2.2,<0.3; python_version<'3.10'",
  "lxml>=5.3,<7",
  "pydantic>=2.10.5,<3",
  "requests>=2.32.3,<3",
  "typing-extensions>=4.12.2,<5",
]
urls.Documentation = "https://egpl.dev/pyjlyric/"
urls.Issues = "https://github.com/eggplants/pyjlyric/issues"
urls.Repository = "https://github.com/eggplants/pyjlyric"
scripts.jrc = "pyjlyric.cli:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt-py>=0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.include = [ "pyjlyric" ]
build.targets.sdist.include = [ "pyjlyric" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
# Own package: no cooldown needed.
exclude-newer-package = { pyproject-fmt-py = "P0D" }
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "ALL",
]
lint.ignore = [
  "COM812",
  "CPY001", # Missing copyright notice (this project does not use file headers)
  "D",
]
lint.per-file-ignores."pyjlyric/kashinavi/parser.py" = [
  "C901",    # Function is too complex (one pass over the loosely structured detail block)
  "PLR0912", # Too many branches (one pass over the loosely structured detail block)
  "RUF001",  # Ambiguous unicode character (the page labels use a full-width colon)
]
lint.per-file-ignores."pyjlyric/utaten/parser.py" = [
  "C901", # Function is too complex (one pass over the loosely structured detail block)
]
lint.per-file-ignores."pyjlyric/util.py" = [
  "PLR0913", # Too many arguments (they are optional keyword-only request knobs)
]
lint.per-file-ignores."tests/test_*.py" = [
  "S101", # Use of assert detected
]
lint.mccabe.max-complexity = 11
lint.pydocstyle.convention = "google"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
